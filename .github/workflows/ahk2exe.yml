name: Build executable with Ahk2Exe

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AUTOHOTKEY_VERSION: 2.0.26
  AUTOHOTKEY_SHA256: 43522aa3122a57784ac5db30abf85c2244475c36acd7796e2c993355f9e926ae
  AUTOHOTKEY_SOURCE_SHA256: 765ada5ae0a543f470bcd30371a7b95438e59351b0a20508c516df76a4f73ca4
  AHK2EXE_VERSION: 1.1.37.02a2
  AHK2EXE_SHA256: c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Downloaded build tools run later in this job; do not leave the token
          # in the checkout's git config for them.
          persist-credentials: false

      - name: Verify repository contract
        shell: pwsh
        run: |
          & tests/RepositoryContract.ps1

      # The tag is the single source of truth for the version. Generating this file
      # here keeps the executable metadata and updater version on the same value.
      - name: Generate Version.ahk
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          & scripts/GenerateVersion.ps1 `
            -RefType $env:REF_TYPE `
            -RefName $env:REF_NAME `
            -CommitSha $env:COMMIT_SHA `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'Version.ahk')

          Get-Content Version.ahk

      - name: Install verified build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Sha256 {
            param(
              [Parameter(Mandatory)]
              [string] $Path,
              [Parameter(Mandatory)]
              [string] $Expected
            )

            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path (expected $Expected, found $actual)"
            }
          }

          $toolRoot = Join-Path $env:RUNNER_TEMP 'pacs-assistant-build-tools'
          $ahkZip = Join-Path $toolRoot 'AutoHotkey.zip'
          $ahkDir = Join-Path $toolRoot 'AutoHotkey'
          $ahkSourceZip = Join-Path $env:GITHUB_WORKSPACE "AutoHotkey-v$($env:AUTOHOTKEY_VERSION)-source.zip"
          $ahk2ExeZip = Join-Path $toolRoot 'Ahk2Exe.zip'
          $ahk2ExeDir = Join-Path $toolRoot 'Ahk2Exe'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null

          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$($env:AUTOHOTKEY_VERSION)/AutoHotkey_$($env:AUTOHOTKEY_VERSION).zip"
          Invoke-WebRequest -Uri $ahkUrl -OutFile $ahkZip -MaximumRetryCount 3 -RetryIntervalSec 5
          Assert-Sha256 -Path $ahkZip -Expected $env:AUTOHOTKEY_SHA256
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $ahkDir -Force

          $ahkSourceUrl = "https://github.com/AutoHotkey/AutoHotkey/archive/refs/tags/v$($env:AUTOHOTKEY_VERSION).zip"
          Invoke-WebRequest -Uri $ahkSourceUrl -OutFile $ahkSourceZip -MaximumRetryCount 3 -RetryIntervalSec 5
          Assert-Sha256 -Path $ahkSourceZip -Expected $env:AUTOHOTKEY_SOURCE_SHA256

          $ahk2ExeUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe$($env:AHK2EXE_VERSION)/Ahk2Exe$($env:AHK2EXE_VERSION).zip"
          Invoke-WebRequest -Uri $ahk2ExeUrl -OutFile $ahk2ExeZip -MaximumRetryCount 3 -RetryIntervalSec 5
          Assert-Sha256 -Path $ahk2ExeZip -Expected $env:AHK2EXE_SHA256
          Expand-Archive -LiteralPath $ahk2ExeZip -DestinationPath $ahk2ExeDir -Force

          $ahkExe = Join-Path $ahkDir 'AutoHotkey64.exe'
          $compilerExe = Join-Path $ahk2ExeDir 'Ahk2Exe.exe'
          if (-not (Test-Path -LiteralPath $ahkExe -PathType Leaf)) {
            throw "AutoHotkey executable was not found at $ahkExe"
          }
          if (-not (Test-Path -LiteralPath $compilerExe -PathType Leaf)) {
            throw "Ahk2Exe executable was not found at $compilerExe"
          }

          "AHK_EXE=$ahkExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK2EXE_EXE=$compilerExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The desktop suites stay local-only, but /validate loads them without opening
      # windows or registering hotkeys, so their load errors still fail CI.
      - name: Validate syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('main.ahk', 'WinHttpMetadataWorkerMain.ahk', 'tests\run-hotkey-tests.ahk', 'tests\run-gui-smoke.ahk', 'tests\run-ui-audit.ahk')) {
            $stdout = Join-Path $env:RUNNER_TEMP 'syntax-output.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'syntax-errors.txt'
            $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @(
              '/validate',
              '/ErrorStdOut',
              $script
            ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) {
              throw "Syntax validation failed for $script (exit $($process.ExitCode))"
            }
            # A #Warn warning prints to stdout but leaves the exit code at 0.
            if (Select-String -LiteralPath $stdout, $stderr -SimpleMatch '==> Warning:' -Quiet) {
              throw "AutoHotkey reported warnings for $script"
            }
          }

      # Its own timeout: a harness that blocks on a desktop dialog must fail fast rather
      # than hold the runner for the whole job timeout.
      - name: Run unit tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'test-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'test-errors.txt'
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @(
            '/ErrorStdOut',
            'tests\RunTests.ahk'
          ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "Unit tests failed (exit $($process.ExitCode))"
          }
          if (Select-String -LiteralPath $stdout, $stderr -SimpleMatch '==> Warning:' -Quiet) {
            throw "AutoHotkey reported warnings for the unit tests"
          }

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'compile-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'compile-errors.txt'
          $process = Start-Process -FilePath $env:AHK2EXE_EXE -ArgumentList @(
            '/in',
            'main.ahk',
            '/out',
            'pacs-assistant.exe',
            '/base',
            $env:AHK_EXE,
            '/compress',
            '0',
            '/silent',
            'verbose'
          ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "Compilation failed (exit $($process.ExitCode))"
          }
          if (-not (Test-Path -LiteralPath 'pacs-assistant.exe' -PathType Leaf)) {
            throw 'Compilation reported success without creating pacs-assistant.exe'
          }

          $artifact = Get-Item -LiteralPath 'pacs-assistant.exe'
          if ($artifact.Length -le 0) {
            throw 'Compiled executable is empty'
          }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash
          Write-Host "Built $($artifact.FullName) ($($artifact.Length) bytes, SHA-256 $hash)"

      # Update checks run only in compiled builds, through the worker script embedded
      # in the executable. Run that worker once, network-free: it must refuse an
      # unsupported URL itself and report the refusal through its request directory.
      - name: Smoke-test the embedded metadata worker
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Join-Path $env:RUNNER_TEMP ('pacs-metadata-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $request | Out-Null
          Set-Content -LiteralPath (Join-Path $request 'request.ini') -Encoding unicode -Value @(
            '[Request]',
            'Url=https://example.invalid/',
            'MaximumSize=16'
          )
          $process = Start-Process -FilePath (Resolve-Path 'pacs-assistant.exe') -ArgumentList @(
            '/script',
            '/ErrorStdOut',
            '*WINHTTPMETADATAWORKER',
            "`"$request`""
          ) -Wait -PassThru
          $errorPath = Join-Path $request 'error.txt'
          $errorText = if (Test-Path -LiteralPath $errorPath) { Get-Content -LiteralPath $errorPath -Raw -Encoding utf8 } else { '' }
          if ($process.ExitCode -ne 10 -or $errorText -notmatch 'Unsupported update metadata URL') {
            throw "The embedded metadata worker did not refuse the unsupported URL (exit $($process.ExitCode)): $errorText"
          }
          Write-Host 'The embedded metadata worker ran and refused the unsupported URL.'

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacs-assistant-build
          path: |
            pacs-assistant.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/AutoHotkey-v2.0.26.txt
            AutoHotkey-v2.0.26-source.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacs-assistant-build
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            (Join-Path $PWD 'release/pacs-assistant.exe'),
            (Join-Path $PWD 'release/LICENSE'),
            (Join-Path $PWD 'release/THIRD_PARTY_NOTICES.md'),
            (Join-Path $PWD 'release/licenses/AutoHotkey-v2.0.26.txt'),
            (Join-Path $PWD 'release/AutoHotkey-v2.0.26-source.zip')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }

          $expectedPrerelease = $env:RELEASE_TAG -match '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-'

          function Invoke-GitHubJson {
            param(
              [Parameter(Mandatory)][string] $Endpoint,
              [ValidateSet('GET', 'POST', 'PATCH')][string] $Method = 'GET',
              [hashtable] $Body,
              [string] $InputFile = ''
            )

            $requestFile = $null
            try {
              $apiArguments = @(
                'api', '--method', $Method,
                '--header', 'Accept: application/vnd.github+json',
                '--header', 'X-GitHub-Api-Version: 2022-11-28',
                $Endpoint
              )
              if ($null -ne $Body) {
                $requestFile = New-TemporaryFile
                [IO.File]::WriteAllText($requestFile.FullName, ($Body | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
                $apiArguments += @('--input', $requestFile.FullName, '--header', 'Content-Type: application/json')
              } elseif ($InputFile) {
                $apiArguments += @('--input', $InputFile, '--header', 'Content-Type: application/octet-stream')
              }
              $output = @(& gh @apiArguments 2>&1)
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub API $Method request failed for '$Endpoint': $($output -join ' ')"
              }
              return ($output -join "`n") | ConvertFrom-Json
            } finally {
              if ($null -ne $requestFile) {
                Remove-Item -LiteralPath $requestFile.FullName -Force
              }
            }
          }

          function Resolve-ReleaseTagCommit {
            param([Parameter(Mandatory)][string] $EncodedTag)

            $tagReference = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$EncodedTag"
            $tagObject = $tagReference.object
            for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 8; $depth++) {
              $annotatedTag = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagObject.sha)"
              $tagObject = $annotatedTag.object
            }
            if ($tagObject.type -ne 'commit') {
              throw "Release tag '$env:RELEASE_TAG' did not resolve to a commit."
            }
            return [string] $tagObject.sha
          }

          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $actualTagCommit = Resolve-ReleaseTagCommit $encodedTag
          & scripts/AssertReleaseTagCommit.ps1 `
            -ExpectedCommitSha $env:EXPECTED_COMMIT `
            -ActualTagCommitSha $actualTagCommit

          function Find-ReleaseByTag {
            $releaseOutput = @(& gh api `
              --method GET `
              --header 'Accept: application/vnd.github+json' `
              --header 'X-GitHub-Api-Version: 2022-11-28' `
              --paginate `
              --slurp `
              "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list releases for '$env:RELEASE_TAG': $($releaseOutput -join ' ')"
            }
            return & scripts/FindReleaseByTag.ps1 `
              -ReleaseJson ($releaseOutput -join "`n") `
              -ReleaseTag $env:RELEASE_TAG
          }

          $release = Find-ReleaseByTag
          if ($release -and -not $release.draft) {
            & scripts/ValidateExistingRelease.ps1 `
              -Release $release `
              -ReleaseTag $env:RELEASE_TAG `
              -ExpectedPrerelease $expectedPrerelease `
              -ExpectedCommitSha $env:EXPECTED_COMMIT `
              -ActualTagCommitSha $actualTagCommit `
              -Assets $assets

            Write-Host "Release '$env:RELEASE_TAG' already matches the complete release contract; publication is a no-op."
          } else {
            if ($release -and $release.draft) {
              & scripts/ValidateOwnedDraftRelease.ps1 `
                -Release $release `
                -ReleaseTag $env:RELEASE_TAG `
                -ExpectedPrerelease $expectedPrerelease
              $deleteOutput = @(& gh api `
                --method DELETE `
                --header 'Accept: application/vnd.github+json' `
                --header 'X-GitHub-Api-Version: 2022-11-28' `
                "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" 2>&1)
              if ($LASTEXITCODE -ne 0) {
                throw "Interrupted draft cleanup failed: $($deleteOutput -join ' ')"
              }
            }

            $createdDraftId = 0
            $published = $false
            try {
              # Capture the response object's ID directly; all later mutations and
              # reads address that same release, even if another same-tag draft appears.
              $createdDraft = Invoke-GitHubJson -Method POST `
                -Endpoint "repos/$env:GITHUB_REPOSITORY/releases" `
                -Body @{
                  tag_name = $env:RELEASE_TAG
                  target_commitish = $env:EXPECTED_COMMIT
                  name = $env:RELEASE_TAG
                  generate_release_notes = $true
                  draft = $true
                  prerelease = $expectedPrerelease
                  make_latest = 'false'
                }
              & scripts/ValidateOwnedDraftRelease.ps1 `
                -Release $createdDraft `
                -ReleaseTag $env:RELEASE_TAG `
                -ExpectedPrerelease $expectedPrerelease
              $createdDraftId = [long] $createdDraft.id

              foreach ($asset in $assets) {
                $assetName = [Uri]::EscapeDataString([IO.Path]::GetFileName($asset))
                $null = Invoke-GitHubJson -Method POST `
                  -Endpoint "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$createdDraftId/assets?name=$assetName" `
                  -InputFile $asset
              }

              $actualTagCommit = Resolve-ReleaseTagCommit $encodedTag
              & scripts/AssertReleaseTagCommit.ps1 `
                -ExpectedCommitSha $env:EXPECTED_COMMIT `
                -ActualTagCommitSha $actualTagCommit

              $uploadedDraft = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/releases/$createdDraftId"
              if ($uploadedDraft.id -ne $createdDraftId) {
                throw 'The uploaded release does not match the created draft ID.'
              }
              & scripts/ValidateExistingRelease.ps1 `
                -Release $uploadedDraft `
                -ReleaseTag $env:RELEASE_TAG `
                -ExpectedPrerelease $expectedPrerelease `
                -ExpectedDraft $true `
                -ExpectedCommitSha $env:EXPECTED_COMMIT `
                -ActualTagCommitSha $actualTagCommit `
                -Assets $assets

              $latestPolicy = if ($expectedPrerelease) { 'false' } else { 'legacy' }
              $publishedRelease = Invoke-GitHubJson -Method PATCH `
                -Endpoint "repos/$env:GITHUB_REPOSITORY/releases/$createdDraftId" `
                -Body @{ draft = $false; make_latest = $latestPolicy }
              if ($publishedRelease.id -ne $createdDraftId) {
                throw 'The publication response does not match the created draft ID.'
              }
              & scripts/ValidateExistingRelease.ps1 `
                -Release $publishedRelease `
                -ReleaseTag $env:RELEASE_TAG `
                -ExpectedPrerelease $expectedPrerelease `
                -ExpectedCommitSha $env:EXPECTED_COMMIT `
                -ActualTagCommitSha $actualTagCommit `
                -Assets $assets
              $published = $true
            } catch {
              $publicationError = $_
              if ($createdDraftId -gt 0 -and -not $published) {
                $disposition = 'leave'
                try {
                  # The PATCH request may have reached GitHub even when the CLI lost
                  # its success response. Re-read server state before any deletion:
                  # a matching published release is success, while only the same
                  # workflow-owned object still proven to be a draft may be cleaned.
                  $failedRelease = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/releases/$createdDraftId"
                  $disposition = & scripts/ClassifyReleaseAfterPublishFailure.ps1 `
                    -Release $failedRelease `
                    -CreatedDraftId $createdDraftId `
                    -ReleaseTag $env:RELEASE_TAG `
                    -ExpectedPrerelease $expectedPrerelease

                  if ($disposition -eq 'published') {
                    $actualTagCommit = Resolve-ReleaseTagCommit $encodedTag
                    & scripts/ValidateExistingRelease.ps1 `
                      -Release $failedRelease `
                      -ReleaseTag $env:RELEASE_TAG `
                      -ExpectedPrerelease $expectedPrerelease `
                      -ExpectedCommitSha $env:EXPECTED_COMMIT `
                      -ActualTagCommitSha $actualTagCommit `
                      -Assets $assets
                    $published = $true
                    Write-Host "Release '$env:RELEASE_TAG' was published despite the lost CLI response; server state matches the complete release contract."
                  }
                } catch {
                  Write-Warning "Release state could not be reconciled safely after publication failure: $($_.Exception.Message)"
                  $disposition = 'leave'
                }

                if ($disposition -eq 'cleanup-draft') {
                  $cleanupOutput = @(& gh api `
                    --method DELETE `
                    --header 'Accept: application/vnd.github+json' `
                    --header 'X-GitHub-Api-Version: 2022-11-28' `
                    "repos/$env:GITHUB_REPOSITORY/releases/$createdDraftId" 2>&1)
                  if ($LASTEXITCODE -ne 0) {
                    Write-Warning "Draft cleanup also failed: $($cleanupOutput -join ' ')"
                  }
                }
              }
              if (-not $published) {
                throw $publicationError
              }
            }
          }
