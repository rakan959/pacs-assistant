name: Build executable with ahk2exe

on: push

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The tag is the single source of truth for the version. Generating this file
      # here is what stops the shipped version drifting from the release it was cut
      # from, which is how v2.0b4 ended up reporting itself while v2.0b7 was published.
      - name: Generate Version.ahk
        shell: pwsh
        run: |
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          if ($isTag) {
            $version = '${{ github.ref_name }}'
            $isDev = 'false'
          } else {
            $version = "v0.0.0-dev+$($env:GITHUB_SHA.Substring(0,7))"
            $isDev = 'true'
          }

          # Windows file version needs a numeric quad
          if ($version -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $quad = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } elseif ($version -match '^v?(\d+)\.(\d+)') {
            $quad = "$($Matches[1]).$($Matches[2]).0.0"
          } else {
            $quad = '0.0.0.0'
          }

          Write-Host "version=$version  isDev=$isDev  fileVersion=$quad"

          @"
          #Requires AutoHotkey v2.0

          ; GENERATED BY CI - see .github/workflows/ahk2exe.yml
          ; Built from: $version

          ;@Ahk2Exe-SetVersion $quad
          ;@Ahk2Exe-SetProductVersion $quad
          ;@Ahk2Exe-SetDescription PACS Assistant
          ;@Ahk2Exe-SetCopyright MIT

          class AppVersion {
              static current := "$version"
              static isDevBuild := $isDev
          }
          "@ | Set-Content -Path Version.ahk -Encoding UTF8

          Get-Content Version.ahk

      # The suite existed but nothing ran it, so a regression could reach a release
      # with every check green. Only the unit suite runs here: run-hotkey-tests.ahk
      # registers real hotkeys and run-gui-smoke.ahk opens real windows, neither of
      # which is dependable on a hosted runner.
      - name: Run unit tests
        shell: pwsh
        run: |
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.18/AutoHotkey_2.0.18.zip'
          Invoke-WebRequest -Uri $url -OutFile ahk.zip
          Expand-Archive -Path ahk.zip -DestinationPath ahk -Force
          $exe = Join-Path (Resolve-Path ahk) 'AutoHotkey64.exe'

          # AutoHotkey is a GUI-subsystem binary, so the call operator does not wait
          # for it and never sets $LASTEXITCODE - the results printed after the check
          # had already run. Start-Process -Wait -PassThru gives a real exit code.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList '/ErrorStdOut', 'tests\RunTests.ahk' `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput test-output.txt -RedirectStandardError test-errors.txt
          Get-Content test-output.txt
          if (Test-Path test-errors.txt) { Get-Content test-errors.txt }
          if ($proc.ExitCode -ne 0) {
            throw "Unit tests failed (exit $($proc.ExitCode))"
          }

      - name: Compile with ahk2exe
        uses: benmusson/ahk2exe-action@v1
        with:
          in: main.ahk
          out: pacs-assistant.exe
          compression: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pacs-assistant-dev
          path: pacs-assistant.exe
          retention-days: 14

      # A tag containing a hyphen is a SemVer prerelease (v2.1.0-beta.1). Marking it as
      # such lets the update checker use GitHub's own /releases/latest, which excludes
      # prereleases, instead of guessing from the tag name.
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: pacs-assistant.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
