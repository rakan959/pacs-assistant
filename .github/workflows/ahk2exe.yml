name: Build executable with Ahk2Exe

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AUTOHOTKEY_VERSION: 2.0.26
  AUTOHOTKEY_SHA256: 43522aa3122a57784ac5db30abf85c2244475c36acd7796e2c993355f9e926ae
  AUTOHOTKEY_SOURCE_SHA256: 765ada5ae0a543f470bcd30371a7b95438e59351b0a20508c516df76a4f73ca4
  AHK2EXE_VERSION: 1.1.37.02a2
  AHK2EXE_SHA256: c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify repository contract
        shell: pwsh
        run: |
          & tests/RepositoryContract.ps1

      # The tag is the single source of truth for the version. Generating this file
      # here keeps the executable metadata and updater version on the same value.
      - name: Generate Version.ahk
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          & scripts/GenerateVersion.ps1 `
            -RefType $env:REF_TYPE `
            -RefName $env:REF_NAME `
            -CommitSha $env:COMMIT_SHA `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'Version.ahk')

          Get-Content Version.ahk

      - name: Install verified build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Sha256 {
            param(
              [Parameter(Mandatory)]
              [string] $Path,
              [Parameter(Mandatory)]
              [string] $Expected
            )

            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path (expected $Expected, found $actual)"
            }
          }

          $toolRoot = Join-Path $env:RUNNER_TEMP 'pacs-assistant-build-tools'
          $ahkZip = Join-Path $toolRoot 'AutoHotkey.zip'
          $ahkDir = Join-Path $toolRoot 'AutoHotkey'
          $ahkSourceZip = Join-Path $env:GITHUB_WORKSPACE "AutoHotkey-v$($env:AUTOHOTKEY_VERSION)-source.zip"
          $ahk2ExeZip = Join-Path $toolRoot 'Ahk2Exe.zip'
          $ahk2ExeDir = Join-Path $toolRoot 'Ahk2Exe'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null

          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$($env:AUTOHOTKEY_VERSION)/AutoHotkey_$($env:AUTOHOTKEY_VERSION).zip"
          Invoke-WebRequest -Uri $ahkUrl -OutFile $ahkZip
          Assert-Sha256 -Path $ahkZip -Expected $env:AUTOHOTKEY_SHA256
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $ahkDir -Force

          $ahkSourceUrl = "https://github.com/AutoHotkey/AutoHotkey/archive/refs/tags/v$($env:AUTOHOTKEY_VERSION).zip"
          Invoke-WebRequest -Uri $ahkSourceUrl -OutFile $ahkSourceZip
          Assert-Sha256 -Path $ahkSourceZip -Expected $env:AUTOHOTKEY_SOURCE_SHA256

          $ahk2ExeUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe$($env:AHK2EXE_VERSION)/Ahk2Exe$($env:AHK2EXE_VERSION).zip"
          Invoke-WebRequest -Uri $ahk2ExeUrl -OutFile $ahk2ExeZip
          Assert-Sha256 -Path $ahk2ExeZip -Expected $env:AHK2EXE_SHA256
          Expand-Archive -LiteralPath $ahk2ExeZip -DestinationPath $ahk2ExeDir -Force

          $ahkExe = Join-Path $ahkDir 'AutoHotkey64.exe'
          $compilerExe = Join-Path $ahk2ExeDir 'Ahk2Exe.exe'
          if (-not (Test-Path -LiteralPath $ahkExe -PathType Leaf)) {
            throw "AutoHotkey executable was not found at $ahkExe"
          }
          if (-not (Test-Path -LiteralPath $compilerExe -PathType Leaf)) {
            throw "Ahk2Exe executable was not found at $compilerExe"
          }

          "AHK_EXE=$ahkExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK2EXE_EXE=$compilerExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'syntax-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'syntax-errors.txt'
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @(
            '/validate',
            '/ErrorStdOut',
            'main.ahk'
          ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "Syntax validation failed (exit $($process.ExitCode))"
          }

      # The hotkey and GUI smoke suites interact with the real desktop and remain local-only.
      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'test-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'test-errors.txt'
          $process = Start-Process -FilePath $env:AHK_EXE -ArgumentList @(
            '/ErrorStdOut',
            'tests\RunTests.ahk'
          ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "Unit tests failed (exit $($process.ExitCode))"
          }

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'compile-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'compile-errors.txt'
          $process = Start-Process -FilePath $env:AHK2EXE_EXE -ArgumentList @(
            '/in',
            'main.ahk',
            '/out',
            'pacs-assistant.exe',
            '/base',
            $env:AHK_EXE,
            '/compress',
            '0',
            '/silent',
            'verbose'
          ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "Compilation failed (exit $($process.ExitCode))"
          }
          if (-not (Test-Path -LiteralPath 'pacs-assistant.exe' -PathType Leaf)) {
            throw 'Compilation reported success without creating pacs-assistant.exe'
          }

          $artifact = Get-Item -LiteralPath 'pacs-assistant.exe'
          if ($artifact.Length -le 0) {
            throw 'Compiled executable is empty'
          }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash
          Write-Host "Built $($artifact.FullName) ($($artifact.Length) bytes, SHA-256 $hash)"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacs-assistant-build
          path: |
            pacs-assistant.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/AutoHotkey-v2.0.26.txt
            AutoHotkey-v2.0.26-source.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacs-assistant-build
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            (Join-Path $PWD 'release/pacs-assistant.exe'),
            (Join-Path $PWD 'release/LICENSE'),
            (Join-Path $PWD 'release/THIRD_PARTY_NOTICES.md'),
            (Join-Path $PWD 'release/licenses/AutoHotkey-v2.0.26.txt'),
            (Join-Path $PWD 'release/AutoHotkey-v2.0.26-source.zip')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }

          $expectedPrerelease = $env:RELEASE_TAG -match '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-'

          function Invoke-GitHubJson {
            param([Parameter(Mandatory)][string] $Endpoint)

            $output = @(& gh api `
              --method GET `
              --header 'Accept: application/vnd.github+json' `
              --header 'X-GitHub-Api-Version: 2022-11-28' `
              $Endpoint 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub API request failed for '$Endpoint': $($output -join ' ')"
            }
            return ($output -join "`n") | ConvertFrom-Json
          }

          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $tagReference = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag"
          $tagObject = $tagReference.object
          for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 8; $depth++) {
            $annotatedTag = Invoke-GitHubJson "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagObject.sha)"
            $tagObject = $annotatedTag.object
          }
          if ($tagObject.type -ne 'commit') {
            throw "Release tag '$env:RELEASE_TAG' did not resolve to a commit."
          }
          $actualTagCommit = [string] $tagObject.sha

          $releaseEndpoint = "repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $releaseOutput = @(& gh api `
            --method GET `
            --header 'Accept: application/vnd.github+json' `
            --header 'X-GitHub-Api-Version: 2022-11-28' `
            $releaseEndpoint 2>&1)
          $releaseExitCode = $LASTEXITCODE
          $publish = $true

          if ($releaseExitCode -eq 0) {
            $release = ($releaseOutput -join "`n") | ConvertFrom-Json
            & scripts/ValidateExistingRelease.ps1 `
              -Release $release `
              -ReleaseTag $env:RELEASE_TAG `
              -ExpectedPrerelease $expectedPrerelease `
              -ExpectedCommitSha $env:EXPECTED_COMMIT `
              -ActualTagCommitSha $actualTagCommit `
              -Assets $assets

            Write-Host "Release '$env:RELEASE_TAG' already matches the complete release contract; publication is a no-op."
            $publish = $false
          } elseif (($releaseOutput -join "`n") -notmatch '(?i)HTTP 404|Not Found') {
            throw "Could not determine whether release '$env:RELEASE_TAG' exists: $($releaseOutput -join ' ')"
          } else {
            $arguments = @(
              'release',
              'create',
              $env:RELEASE_TAG
            ) + $assets + @(
              '--repo',
              $env:GITHUB_REPOSITORY,
              '--title',
              $env:RELEASE_TAG,
              '--generate-notes',
              '--verify-tag'
            )
            if ($expectedPrerelease) {
              $arguments += '--prerelease'
            }
          }

          if ($publish) {
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release command failed (exit $LASTEXITCODE)"
            }
          }
